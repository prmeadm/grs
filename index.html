<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заказ услуг</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берутся из темы Telegram; запасные значения нужны только для проверки в обычном браузере */
  :root {
    --fb-bg: #efeff4; --fb-card: #ffffff; --fb-text: #111114; --fb-hint: #8e8e93; --fb-accent: #2481cc; --fb-accent-text: #ffffff;
    --bg: var(--tg-theme-secondary-bg-color, var(--fb-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --head: var(--tg-theme-section-header-text-color, var(--hint));
    --accent: var(--tg-theme-button-color, var(--fb-accent));
    --accent-text: var(--tg-theme-button-text-color, var(--fb-accent-text));
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --gold-1: #e9cf8a; --gold-2: #b98a2e;
    --safe-b: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fb-bg: #000; --fb-card: #1c1c1e; --fb-text: #f2f2f7; --fb-hint: #8d8d93; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    padding: 12px 12px calc(24px + var(--safe-b));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; margin: 8px 4px 4px; }
  .lead { color: var(--hint); margin: 0 4px 18px; font-size: 15px; }

  .group { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 22px; }
  .group-title { color: var(--head); font-size: 14px; font-weight: 600; margin: 0 4px 7px; }

  .field { display: block; padding: 11px 14px 12px; }
  .field span { display: block; font-size: 13px; color: var(--hint); margin-bottom: 3px; }
  .field input {
    width: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 17px; padding: 2px 0;
  }
  .field input::placeholder { color: var(--hint); opacity: .7; }
  .field.invalid span { color: var(--danger); }
  .field.invalid { animation: nudge .32s ease; }
  @keyframes nudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .item { position: relative; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; height: 1px; background: var(--sep); }
  .row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; min-height: 60px; }

  /* Фото к услуге: столько ячеек, сколько выбрано штук */
  .photos { padding: 0 12px 12px 62px; }
  .photos-label { font-size: 13px; color: var(--hint); margin-bottom: 7px; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot {
    position: relative; width: 58px; height: 58px; border-radius: 10px; flex: none;
    border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent);
    background: color-mix(in srgb, var(--accent) 6%, transparent);
    color: var(--accent); font: inherit; font-size: 22px; cursor: pointer; padding: 0;
    display: grid; place-items: center;
  }
  /* Данные для табличек: блок на каждую штуку */
  .plates { padding: 0 12px 12px 62px; display: grid; gap: 10px; }
  .plate { border-radius: 12px; background: color-mix(in srgb, var(--hint) 9%, transparent); padding: 10px 10px 12px; }
  .plate-title { font-size: 13px; font-weight: 600; color: var(--hint); margin: 0 2px 6px; }
  .plate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plate-grid .wide { grid-column: 1 / -1; }
  .mini { display: block; background: var(--card); border-radius: 9px; padding: 6px 10px 7px; border: 1px solid transparent; }
  .mini span { display: block; font-size: 12px; color: var(--hint); }
  .mini input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; padding: 1px 0; font-variant-numeric: tabular-nums; }
  .mini input::placeholder { color: var(--hint); opacity: .6; }
  .mini.invalid { border-color: var(--danger); }
  .mini.invalid span { color: var(--danger); }
  .plate-photo { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--hint); }
  .slot.filled { border: 0; background: var(--sep) center / cover no-repeat; cursor: default; }
  .slot .rm {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--card);
    background: var(--text); color: var(--card); font-size: 13px; line-height: 1; padding: 0; cursor: pointer;
    display: grid; place-items: center;
  }
  .slot .num {
    position: absolute; left: 4px; bottom: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 11px; line-height: 16px; text-align: center;
  }
  .name { font-size: 16px; }
  .price { font-size: 14px; color: var(--hint); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .row.picked .price { color: var(--accent); }

  /* Миниатюра в реальной пропорции: 1 см = 1.05 px, так что форматы видно относительно друг друга */
  .glyph { width: 40px; height: 40px; display: grid; place-items: center; }
  .shape { width: calc(var(--w) * 1.05px); height: calc(var(--h) * 1.05px); border-radius: 1.5px; }
  .k-frame  { border: 3.5px solid var(--text); background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  .k-photo  { border: 1.5px solid color-mix(in srgb, var(--hint) 70%, transparent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .k-plate  { background: linear-gradient(135deg, color-mix(in srgb, var(--hint) 55%, var(--card)), color-mix(in srgb, var(--hint) 25%, var(--card))); border-radius: 3px; }
  .k-gold   { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); border-radius: 3px; }
  .k-svc    { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--hint); }

  .add, .stepper button {
    border: 0; font: inherit; cursor: pointer; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    width: 34px; height: 34px; border-radius: 17px; font-size: 22px; line-height: 1;
    display: grid; place-items: center; touch-action: manipulation;
  }
  .stepper { display: flex; align-items: center; gap: 2px; background: color-mix(in srgb, var(--accent) 13%, transparent); border-radius: 17px; }
  .stepper button { background: transparent; }
  .stepper output { min-width: 22px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Заглушка, пока грузится прайс */
  .skeleton .row { grid-template-columns: 40px 1fr 34px; }
  .bone { height: 12px; border-radius: 6px; background: var(--sep); animation: pulse 1.2s ease-in-out infinite; }
  .bone.sq { width: 26px; height: 32px; border-radius: 3px; margin: auto; }
  .bone.btn { width: 34px; height: 34px; border-radius: 17px; }
  @keyframes pulse { 50% { opacity: .45; } }
  .state { text-align: center; color: var(--hint); padding: 36px 12px; }
  .state button { margin-top: 12px; }
  .link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 8px; }

  /* Кнопка для проверки в браузере; в Telegram используется его собственная нижняя кнопка */
  .fallback {
    position: sticky; bottom: calc(10px + var(--safe-b)); width: 100%; margin-top: 8px;
    border: 0; border-radius: 12px; padding: 15px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .fallback:disabled { opacity: .6; }

  #done { text-align: center; padding: 18vh 20px 0; max-width: 420px; margin: 0 auto; }
  .check { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .check svg { width: 38px; height: 38px; stroke: var(--accent-text); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .45s .1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  #done h2 { font-size: 24px; margin: 0 0 6px; }
  #done p { color: var(--hint); margin: 0 0 22px; }
  #done .warn { color: var(--danger); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .check svg { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main id="app">
  <h1>Новый заказ</h1>
  <p class="lead">Отметьте услуги и количество, затем оформите заказ.</p>

  <div class="group">
    <label class="field" id="agentField">
      <span>Фамилия и имя агента</span>
      <input id="agent" autocomplete="name" placeholder="Иванов Иван" maxlength="100" enterkeyhint="done">
    </label>
  </div>

  <div id="catalog"></div>
  <button class="fallback" id="fallbackBtn" hidden></button>
  <input type="file" id="filePick" accept="image/*" multiple hidden>
</main>

<section id="done" hidden>
  <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h2 id="doneTitle">Заказ оформлен</h2>
  <p id="doneText"></p>
  <button class="link-btn" id="againBtn">Оформить ещё один заказ</button>
</section>

<script>
/* ======= НАСТРОЙКА: вставь сюда URL веб-приложения Apps Script ======= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyWZOok4ZFCOkRm89GDrKQIdt0QSzuVjiQuN7b2mbrkjHtGmzEyWX5ljvyFK7l6D_Hm/exec';
/* ===================================================================== */

const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const $ = id => document.getElementById(id);
const catalogEl = $('catalog'), agentEl = $('agent'), fallbackBtn = $('fallbackBtn'), filePick = $('filePick');
const CACHE_KEY = 'catalog-v2', AGENT_KEY = 'agent-name';
let items = [], cart = new Map(), busy = false, maxPhotoMb = 20;
const photos = new Map();   // id услуги → массив по штукам: [i] = { file, url, fileId } или пусто
const details = new Map();  // id таблички → массив по штукам: [i] = { fio, born, died }
let pickTarget = null;      // в какую услугу и с какой ячейки добавляем фото

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const haptic = {
  tap() { tg?.HapticFeedback?.selectionChanged(); },
  ok() { tg?.HapticFeedback?.notificationOccurred('success'); },
  err() { tg?.HapticFeedback?.notificationOccurred('error'); }
};
const money = n => {
  const r = Math.round(n * 100) / 100;
  return r.toLocaleString('ru-RU', { minimumFractionDigits: r % 1 ? 2 : 0, maximumFractionDigits: 2 }) + '\u00a0р';
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function alertMsg(text) { tg?.showAlert ? tg.showAlert(text) : alert(text); }

/* ---------- Миниатюры форматов ---------- */
function glyph(name) {
  const n = name.toLowerCase();
  const m = n.match(/(\d+)\s*[x×х*]\s*(\d+)/);
  let kind = 'svc';
  if (n.includes('табличк')) kind = n.includes('золот') ? 'gold' : 'plate';
  else if (n.includes('без рамки')) kind = 'photo';
  else if (n.includes('рамк')) kind = 'frame';
  else if (m) kind = 'photo';
  if (kind === 'svc') return '<span class="glyph"><span class="shape k-svc"></span></span>';
  let [w, h] = m ? [+m[1], +m[2]] : [18, 24];
  if (w > h) [w, h] = [h, w];
  return `<span class="glyph"><span class="shape k-${kind}" style="--w:${w};--h:${h}"></span></span>`;
}

/* ---------- Каталог ---------- */
function render(list) {
  items = list;
  const ids = new Set(list.map(i => i.id));
  for (const id of cart.keys()) if (!ids.has(id)) cart.delete(id);
  for (const id of [...photos.keys()]) if (!ids.has(id) || !list.find(i => i.id === id).photo) dropPhotos(id, 0);
  for (const id of [...details.keys()]) if (!ids.has(id) || !list.find(i => i.id === id).memorial) details.delete(id);

  const groups = new Map();
  list.forEach(it => { if (!groups.has(it.category)) groups.set(it.category, []); groups.get(it.category).push(it); });
  if (!list.length) { catalogEl.innerHTML = '<p class="state">Прайс пока пустой. Добавьте услуги на лист «Прайс» в таблице.</p>'; return; }

  catalogEl.innerHTML = [...groups].map(([cat, arr]) => `
    <h2 class="group-title">${esc(cat)}</h2>
    <div class="group">${arr.map(rowHtml).join('')}</div>`).join('');
  updateTotal();
}

function rowHtml(it) {
  const q = cart.get(it.id) || 0;
  const ctrl = q
    ? `<div class="stepper"><button data-act="minus" aria-label="Убрать одну">−</button><output>${q}</output><button data-act="plus" aria-label="Добавить ещё">+</button></div>`
    : `<button class="add" data-act="plus" aria-label="Добавить ${esc(it.name)}">+</button>`;
  let extra = '';
  if (q && it.memorial) extra = platesHtml(it, q);
  else if (q && it.photo) extra = photosHtml(it.id, q);
  return `<div class="item" data-id="${esc(it.id)}"><div class="row${q ? ' picked' : ''}">
    ${glyph(it.name)}
    <div><div class="name">${esc(it.name)}</div><div class="price">${money(it.price)}${q > 1 ? ' × ' + q + ' = ' + money(it.price * q) : ''}</div></div>
    ${ctrl}</div>${extra}</div>`;
}

function slotHtml(id, i) {
  const p = (photos.get(id) || [])[i];
  return p
    ? `<div class="slot filled" style="background-image:url('${p.url}')" role="img" aria-label="Фото ${i + 1}"><span class="num">${i + 1}</span><button class="rm" data-act="rm" data-i="${i}" aria-label="Убрать фото ${i + 1}">×</button></div>`
    : `<button class="slot" data-act="pick" data-i="${i}" aria-label="Прикрепить фото ${i + 1}">+</button>`;
}

function photosHtml(id, q) {
  const n = countPhotos(id);
  const slots = [];
  for (let i = 0; i < q; i++) slots.push(slotHtml(id, i));
  const label = n ? `Фото: ${n} из ${q}` : `Можно прикрепить фото: до ${q}`;
  return `<div class="photos"><div class="photos-label">${label}</div><div class="slots">${slots.join('')}</div></div>`;
}

function platesHtml(it, q) {
  const arr = details.get(it.id) || [];
  const blocks = [];
  for (let i = 0; i < q; i++) {
    const d = arr[i] || {};
    const field = (f, label, cls, attrs) =>
      `<label class="mini ${cls}"><span>${label}</span><input data-f="${f}" data-i="${i}" value="${esc(d[f] || '')}" ${attrs}></label>`;
    const photo = it.photo
      ? `<div class="plate-photo">${slotHtml(it.id, i)}<span>${(photos.get(it.id) || [])[i] ? 'Фото для таблички' : 'Прикрепить фото (необязательно)'}</span></div>`
      : '';
    blocks.push(`<div class="plate"><div class="plate-title">${q > 1 ? 'Табличка ' + (i + 1) : 'Данные для таблички'}</div>
      <div class="plate-grid">
        ${field('fio', 'ФИО усопшего', 'wide', 'autocomplete="off" autocapitalize="words" maxlength="150" placeholder="Иванов Иван Иванович"')}
        ${field('born', 'Дата рождения', '', 'inputmode="numeric" maxlength="10" placeholder="дд.мм.гггг"')}
        ${field('died', 'Дата смерти', '', 'inputmode="numeric" maxlength="10" placeholder="дд.мм.гггг"')}
      </div>${photo}</div>`);
  }
  return `<div class="plates">${blocks.join('')}</div>`;
}

function countPhotos(id) { return (photos.get(id) || []).filter(Boolean).length; }

function dropPhotos(id, keep) {
  const arr = photos.get(id);
  if (!arr) return;
  arr.splice(keep).forEach(p => p && URL.revokeObjectURL(p.url));
  if (!arr.some(Boolean)) photos.delete(id);
}

function redraw(id) {
  const el = catalogEl.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  if (el) el.outerHTML = rowHtml(items.find(i => i.id === id));
}

catalogEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (btn) {
    const id = btn.closest('.item').dataset.id, act = btn.dataset.act;
    if (act === 'plus' || act === 'minus') {
      const q = (cart.get(id) || 0) + (act === 'plus' ? 1 : -1);
      q > 0 ? cart.set(id, q) : cart.delete(id);
      dropPhotos(id, Math.max(q, 0));   // фото и данные — не больше, чем штук
      if (details.has(id)) { details.get(id).splice(Math.max(q, 0)); if (!q) details.delete(id); }
      haptic.tap();
      redraw(id);
      updateTotal();
    } else if (act === 'pick') {
      if (busy) return;
      pickTarget = { id, from: +btn.dataset.i };
      filePick.value = '';
      filePick.click();
    } else if (act === 'rm') {
      if (busy) return;
      const arr = photos.get(id) || [];
      const i = +btn.dataset.i;
      if (arr[i]) URL.revokeObjectURL(arr[i].url);
      arr[i] = undefined;
      if (!arr.some(Boolean)) photos.delete(id);
      haptic.tap();
      redraw(id);
    }
    return;
  }
  if (e.target.id === 'retry') loadCatalog();
});

// Ввод ФИО и дат: сохраняем без перерисовки, чтобы не сбивать фокус
function maskDate(v) {
  const d = v.replace(/\D/g, '').slice(0, 8);
  return d.length > 4 ? `${d.slice(0, 2)}.${d.slice(2, 4)}.${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}.${d.slice(2)}` : d;
}
catalogEl.addEventListener('input', e => {
  const inp = e.target.closest('input[data-f]');
  if (!inp) return;
  const id = inp.closest('.item').dataset.id, i = +inp.dataset.i, f = inp.dataset.f;
  if (f !== 'fio') {
    const masked = maskDate(inp.value);
    if (masked !== inp.value) inp.value = masked;
  }
  const arr = details.get(id) || [];
  arr[i] = Object.assign({}, arr[i], { [f]: inp.value });
  details.set(id, arr);
  inp.closest('.mini').classList.remove('invalid');
});

filePick.addEventListener('change', () => {
  const t = pickTarget;
  pickTarget = null;
  if (!t || !filePick.files.length) return;
  const q = cart.get(t.id) || 0;
  const arr = photos.get(t.id) || [];
  const it = items.find(x => x.id === t.id);
  // Для табличек фото ставится ровно в свою ячейку; для печати — заполняет свободные ячейки начиная с выбранной
  const free = [];
  for (let i = t.from; i < q; i++) if (!arr[i]) free.push(i);
  if (!it.memorial) for (let i = 0; i < t.from; i++) if (!arr[i]) free.push(i);
  const limit = it.memorial ? Math.min(free.length, 1) : free.length;
  let tooBig = 0, extra = 0, k = 0;
  for (const file of filePick.files) {
    if (k >= limit) { extra++; continue; }
    if (file.size > maxPhotoMb * 1024 * 1024) { tooBig++; continue; }
    arr[free[k++]] = { file, url: URL.createObjectURL(file), fileId: null };
  }
  if (arr.some(Boolean)) photos.set(t.id, arr);
  redraw(t.id);
  const notes = [];
  if (extra) notes.push(it.memorial
    ? `Для одной таблички — одно фото. Не добавлено: ${extra}.`
    : `К этой услуге можно прикрепить не больше ${q} фото, по количеству. Не добавлено: ${extra}.`);
  if (tooBig) notes.push(`Фото больше ${maxPhotoMb} МБ не прикрепляются. Пропущено: ${tooBig}.`);
  if (notes.length) alertMsg(notes.join('\n'));
});

/** Проверка ФИО и дат для всех табличек в корзине. Возвращает текст ошибки или ''. */
function parseDate(s) {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s || '');
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;
  if (+m[3] < 1800 || d > new Date()) return null;
  return d;
}
function validatePlates() {
  let firstBad = null, msg = '';
  const mark = (id, i, f, text) => {
    const inp = catalogEl.querySelector(`.item[data-id="${CSS.escape(id)}"] input[data-f="${f}"][data-i="${i}"]`);
    if (inp) inp.closest('.mini').classList.add('invalid');
    if (!firstBad) { firstBad = inp; msg = text; }
  };
  for (const [id, q] of cart) {
    const it = items.find(x => x.id === id);
    if (!it || !it.memorial) continue;
    const arr = details.get(id) || [];
    for (let i = 0; i < q; i++) {
      const d = arr[i] || {};
      const where = q > 1 ? ` (табличка ${i + 1})` : '';
      if (!String(d.fio || '').trim()) mark(id, i, 'fio', `Укажите ФИО усопшего${where}.`);
      const b = parseDate(d.born), dd = parseDate(d.died);
      if (!b) mark(id, i, 'born', `Укажите дату рождения в формате дд.мм.гггг${where}.`);
      if (!dd) mark(id, i, 'died', `Укажите дату смерти в формате дд.мм.гггг${where}.`);
      if (b && dd && dd < b) mark(id, i, 'died', `Дата смерти раньше даты рождения${where}.`);
    }
  }
  if (firstBad) { firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => firstBad.focus(), 300); }
  return msg;
}

function total() { return items.reduce((s, it) => s + it.price * (cart.get(it.id) || 0), 0); }

function updateTotal() {
  const has = cart.size > 0;
  const label = 'Оформить заказ на ' + money(total());
  if (tg) {
    tg.MainButton.setText(label);
    has ? tg.MainButton.show() : tg.MainButton.hide();
  } else {
    fallbackBtn.textContent = label;
    fallbackBtn.hidden = !has;
  }
}

function skeleton() {
  const row = w => `<div class="item"><div class="row"><span class="bone sq"></span><div><div class="bone" style="width:${w}%"></div><div class="bone" style="width:22%;margin-top:8px"></div></div><span class="bone btn"></span></div></div>`;
  catalogEl.innerHTML = `<h2 class="group-title">Загружаю прайс…</h2><div class="group skeleton">${[70, 55, 62, 48].map(row).join('')}</div>`;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchJson(url, opts = {}, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
    return await res.json();
  } finally {
    clearTimeout(t);
  }
}

async function loadCatalog() {
  let cached = null;
  try { cached = JSON.parse(store.get(CACHE_KEY) || 'null'); } catch (e) {}
  if (cached) render(cached); else skeleton();

  // Сервер Google иногда «просыпается» несколько секунд — пробуем до 3 раз, прежде чем показать ошибку
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const data = await fetchJson(API_URL, {}, attempt === 1 ? 12000 : 20000);
      if (!data.ok) throw new Error(data.error);
      if (data.maxPhotoMb) maxPhotoMb = data.maxPhotoMb;
      store.set(CACHE_KEY, JSON.stringify(data.items));
      render(data.items);
      return;
    } catch (e) {
      if (attempt < 3) await sleep(attempt * 800);
    }
  }
  if (!cached) catalogEl.innerHTML = '<p class="state">Не удалось загрузить прайс. Проверьте интернет.<br><button class="link-btn" id="retry">Повторить</button></p>';
}

/* ---------- Оформление ---------- */
function setBusyText(text) {
  if (tg) { tg.MainButton.setText(text); tg.MainButton.disable(); }
  else { fallbackBtn.disabled = true; fallbackBtn.textContent = text; }
}

async function post(payload) {
  const data = await fetchJson(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // без preflight-запроса, иначе Apps Script не примет
    body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : '' }, payload))
  }, 120000);
  if (!data.ok) throw new Error(data.error || 'Сервер не принял запрос. Попробуйте ещё раз.');
  return data;
}

function readBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(new Error('Не удалось прочитать фото с телефона. Прикрепите его заново.'));
    r.readAsDataURL(file);
  });
}

async function submit() {
  if (busy || !cart.size) return;
  const agent = agentEl.value.replace(/\s+/g, ' ').trim();
  if (!agent) {
    const f = $('agentField');
    f.classList.remove('invalid'); void f.offsetWidth; f.classList.add('invalid');
    agentEl.focus(); haptic.err();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const plateError = validatePlates();
  if (plateError) { haptic.err(); alertMsg(plateError); return; }
  busy = true;
  try {
    // 1. Фото — по одному, оригиналами. Уже загруженные при повторной попытке не грузятся заново
    const queue = [];
    for (const [id, arr] of photos) if (cart.has(id)) arr.forEach(p => { if (p && !p.fileId) queue.push(p); });
    for (let k = 0; k < queue.length; k++) {
      setBusyText(`Загружаю фото ${k + 1} из ${queue.length}…`);
      const data = await post({
        action: 'upload',
        name: queue[k].file.name || 'photo.jpg',
        mime: queue[k].file.type || 'image/jpeg',
        data: await readBase64(queue[k].file)
      });
      queue[k].fileId = data.fileId;
    }

    // 2. Заказ
    setBusyText('Оформляю заказ…');
    const data = await post({
      agent,
      items: [...cart].map(([id, qty]) => ({
        id, qty,
        photos: Array.from({ length: qty }, (_, i) => ((photos.get(id) || [])[i] || {}).fileId || null),
        details: details.has(id) ? Array.from({ length: qty }, (_, i) => details.get(id)[i] || {}) : undefined
      }))
    });
    haptic.ok();
    showDone(data);
  } catch (e) {
    haptic.err();
    alertMsg(e instanceof TypeError || e.name === 'AbortError' ? 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.' : e.message);
  } finally {
    busy = false;
    if (tg) tg.MainButton.enable(); else fallbackBtn.disabled = false;
    if (!$('app').hidden) updateTotal();
  }
}

function showDone(data) {
  $('app').hidden = true; $('done').hidden = false;
  $('doneTitle').textContent = `Заказ №${data.orderNo} оформлен`;
  const ph = data.photos ? `, фото: ${data.photos}` : '';
  $('doneText').textContent = `Сумма ${money(data.total)}${ph}. Заказ записан в таблицу и отправлен в группу.`;
  if (data.warning) { $('doneText').textContent = data.warning; $('doneText').className = 'warn'; }
  if (tg) { tg.MainButton.setText('Закрыть'); tg.MainButton.show(); } else fallbackBtn.hidden = true;
  window.scrollTo(0, 0);
}

function resetOrder() {
  cart.clear();
  for (const id of [...photos.keys()]) dropPhotos(id, 0);
  details.clear(); $('done').hidden = true; $('app').hidden = false; $('doneText').className = '';
  render(items);
}

function onMainButton() { $('done').hidden ? submit() : tg.close(); }

/* ---------- Старт ---------- */
agentEl.value = store.get(AGENT_KEY) ||
  (tg?.initDataUnsafe?.user ? [tg.initDataUnsafe.user.last_name, tg.initDataUnsafe.user.first_name].filter(Boolean).join(' ') : '');
agentEl.addEventListener('input', () => { store.set(AGENT_KEY, agentEl.value.trim()); $('agentField').classList.remove('invalid'); });
agentEl.addEventListener('keydown', e => { if (e.key === 'Enter') agentEl.blur(); });
fallbackBtn.addEventListener('click', submit);
$('againBtn').addEventListener('click', resetOrder);

if (tg) {
  tg.ready(); tg.expand();
  tg.MainButton.onClick(onMainButton);
  const syncTheme = () => document.documentElement.dataset.theme = tg.colorScheme;
  syncTheme(); tg.onEvent('themeChanged', syncTheme);
}
loadCatalog();
</script>
